<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip map · Rome</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E1F2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rome">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--wine:#5E1F2D;--gold:#C9A227;--olive:#6B7A4F;--ink:#241c15}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Hanken Grotesk",system-ui,sans-serif;background:var(--wine)}
  #topbar{position:fixed;top:0;inset-inline:0;z-index:1000;background:rgba(94,31,45,.97);color:#fff;
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(201,162,39,.3)}
  #topbar b{font-family:"Fraunces",serif;font-size:18px;color:#fff}
  #topbar b span{color:var(--gold)}
  #topbar .sp{margin-left:auto}
  .tbtn{font-size:13px;font-weight:700;text-decoration:none;color:var(--wine);background:var(--gold);
    padding:8px 12px;border-radius:999px;border:1px solid #a8871c;white-space:nowrap;cursor:pointer}
  .tbtn.ghost{background:transparent;color:#e8d9c4;border-color:#7a5b3d}
  #map{position:absolute;inset:54px 0 0 0}
  #info{position:fixed;inset-inline:10px;bottom:10px;z-index:1000;background:rgba(255,253,246,.96);
    border:1px solid #ddd0b8;border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(60,26,20,.35);
    font-size:14.5px;color:var(--ink);max-width:520px;margin:0 auto}
  #info b{color:#a8871c}
  .leaflet-popup-content{font-family:"Hanken Grotesk",sans-serif;font-size:14px}
  .leaflet-popup-content a{color:#6E2233;font-weight:700}
  .me{width:18px;height:18px;border-radius:50%;background:#1e88ff;border:3px solid #fff;box-shadow:0 0 0 3px rgba(30,136,255,.4)}
  .num{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
    color:#fff;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .legend{position:fixed;top:62px;inset-inline-end:10px;z-index:1000;background:rgba(255,253,246,.95);border:1px solid #ddd0b8;
    border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink);box-shadow:0 4px 14px rgba(60,26,20,.3)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
</style>
</head>
<body>
<div id="topbar">
  <b>Rome <span>·</span> trip map</b>
  <span class="sp"></span>
  <button class="tbtn" id="dl">⬇️ Offline map</button>
  <button class="tbtn" id="locate">📍 Locate me</button>
  <a class="tbtn ghost" href="essentials.html">🧳 Guide</a>
  <a class="tbtn ghost" href="index.html">← Itinerary</a>
</div>
<div id="map"></div>
<div class="legend"><span><i style="background:#C9A227"></i>Sights</span> &nbsp; <span><i style="background:#6B7A4F"></i>Food</span> &nbsp; <span><i style="background:#7a52a3"></i>Nightlife</span> &nbsp; <span><i style="background:#C0492E"></i>Shopping</span> &nbsp; <span><i style="background:#6E2233"></i>Base</span></div>
<div id="info">Tap <b>📍 Locate me</b> to show your position and the nearest stop. Pins are numbered by day — tap one for details and <b>Waze</b> navigation.</div>

<script>
const SIGHT='#C9A227', FOOD='#6B7A4F', NIGHT='#7a52a3', SHOP='#C0492E', BASE='#6E2233', AIR='#5d6b72';
const stops=[
 {n:"Hotel dei Borgognoni (base)",d:"Your hotel · all 5 nights",lat:41.9010,lng:12.4820,c:BASE},
 {n:"Trevi Fountain",d:"Day 1",lat:41.9009,lng:12.4833,c:SIGHT},
 {n:"Spanish Steps",d:"Day 1",lat:41.9060,lng:12.4823,c:SIGHT},
 {n:"Pantheon",d:"Day 1 · free entry",lat:41.8986,lng:12.4769,c:SIGHT},
 {n:"Armando al Pantheon",d:"Day 1 · dinner",lat:41.8991,lng:12.4767,c:FOOD},
 {n:"Colosseum",d:"Day 2 · book ahead",lat:41.8902,lng:12.4922,c:SIGHT},
 {n:"Roman Forum & Palatine",d:"Day 2",lat:41.8925,lng:12.4853,c:SIGHT},
 {n:"Monti · Ai Tre Scalini",d:"Day 2 · nightlife",lat:41.8952,lng:12.4930,c:NIGHT},
 {n:"Vatican Museums & Sistine Chapel",d:"Day 3 · book ahead",lat:41.9065,lng:12.4536,c:SIGHT},
 {n:"St Peter's Basilica",d:"Day 3 · free",lat:41.9022,lng:12.4539,c:SIGHT},
 {n:"Pizzarium Bonci",d:"Day 3 · lunch",lat:41.9070,lng:12.4470,c:FOOD},
 {n:"Via Cola di Rienzo (shopping)",d:"Day 3",lat:41.9075,lng:12.4645,c:SHOP},
 {n:"Trastevere · Tonnarello",d:"Day 3 · dinner",lat:41.8890,lng:12.4690,c:FOOD},
 {n:"Freni e Frizioni (cocktails)",d:"Day 3 · nightlife",lat:41.8905,lng:12.4695,c:NIGHT},
 {n:"Roma Termini (Florence train)",d:"Day 4 · to Florence",lat:41.9010,lng:12.5010,c:AIR},
 {n:"Piazza Navona",d:"Day 5",lat:41.8992,lng:12.4731,c:SIGHT},
 {n:"Campo de' Fiori · La Carbonara",d:"Day 5 · dinner + nightlife",lat:41.8956,lng:12.4720,c:NIGHT},
 {n:"Via del Corso (shopping)",d:"Day 5",lat:41.9020,lng:12.4790,c:SHOP},
 {n:"Villa Borghese / Pincio",d:"Day 5 · park & view",lat:41.9126,lng:12.4880,c:SIGHT}
];

const map=L.map('map',{zoomControl:true}).setView([41.9010,12.4790],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

L.polyline(stops.map(s=>[s.lat,s.lng]),{color:'#C9A227',weight:3,opacity:.55,dashArray:'2,7'}).addTo(map);

const WAZE=(la,ln)=>'https://waze.com/ul?ll='+la+','+ln+'&navigate=yes';
const bounds=[];
stops.forEach((s,i)=>{
  bounds.push([s.lat,s.lng]);
  const icon=L.divIcon({className:'',html:`<div class="num" style="background:${s.c}">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
  L.marker([s.lat,s.lng],{icon}).addTo(map)
    .bindPopup(`<b>${i+1}. ${s.n}</b><br>${s.d}<br><a href="${WAZE(s.lat,s.lng)}" target="_blank" rel="noopener">🧭 Navigate in Waze ↗</a>`);
});
map.fitBounds(bounds,{padding:[50,50]});

let meMarker=null, meAcc=null;
const info=document.getElementById('info');
function hav(a,b,c,d){const R=6371,t=x=>x*Math.PI/180;const dLat=t(c-a),dLon=t(d-b);
  const x=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function onPos(p){
  const {latitude:la,longitude:ln,accuracy:ac}=p.coords;
  if(!meMarker){
    meMarker=L.marker([la,ln],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
    meAcc=L.circle([la,ln],{radius:ac,color:'#1e88ff',weight:1,fillColor:'#1e88ff',fillOpacity:.08}).addTo(map);
  } else { meMarker.setLatLng([la,ln]); meAcc.setLatLng([la,ln]).setRadius(ac); }
  let best=null,bd=1e9;
  stops.forEach(s=>{const dd=hav(la,ln,s.lat,s.lng);if(dd<bd){bd=dd;best=s;}});
  const dist=bd<1?Math.round(bd*1000)+' m':bd.toFixed(1)+' km';
  info.innerHTML=`📍 <b>You are here.</b> Nearest stop: <b>${best.n}</b> — ${dist} away (as the crow flies).`;
}
function onErr(){ info.innerHTML='⚠️ Couldn\'t get your location. Make sure location permission is allowed and GPS is on.'; }
document.getElementById('locate').addEventListener('click',()=>{
  if(!navigator.geolocation){info.textContent='This browser has no geolocation.';return;}
  info.innerHTML='⏳ Locating…';
  navigator.geolocation.getCurrentPosition(p=>{onPos(p);map.setView([p.coords.latitude,p.coords.longitude],15);},onErr,{enableHighAccuracy:true,timeout:10000,maximumAge:5000});
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000});
});

// ---- offline map download ----
const OFF={s:41.870,w:12.435,n:41.925,e:12.520,minZ:12,maxZ:15,cache:'rome-tiles-v1'};
function _x(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function _y(lat,z){const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));}
function tileList(){const o=[];for(let z=OFF.minZ;z<=OFF.maxZ;z++){const x0=_x(OFF.w,z),x1=_x(OFF.e,z),y0=_y(OFF.n,z),y1=_y(OFF.s,z);for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)o.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);}return o;}
async function downloadOffline(){
  if(!('caches' in window)){info.textContent='This browser does not support offline saving.';return;}
  const urls=tileList(),total=urls.length; let done=0,ok=0;
  const cache=await caches.open(OFF.cache); const q=urls.slice();
  info.innerHTML='⏳ Downloading offline map… 0/'+total+' (keep this page open)';
  async function w(){while(q.length){const u=q.shift();try{const r=await fetch(u,{mode:'no-cors'});await cache.put(u,r);ok++;}catch(e){}done++;if(done%15===0||done===total)info.innerHTML='⏳ Downloading offline map… '+done+'/'+total;}}
  await Promise.all(Array.from({length:6},w));
  try{localStorage.setItem('rome-offline','1');}catch(e){}
  info.innerHTML='✅ Map saved for offline use ('+ok+' tiles). The city map now works without signal.';
  const b=document.getElementById('dl'); if(b)b.textContent='✓ Offline ready';
}
document.getElementById('dl').addEventListener('click',downloadOffline);
try{if(localStorage.getItem('rome-offline')){const b=document.getElementById('dl');if(b)b.textContent='✓ Offline ready';}}catch(e){}
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
